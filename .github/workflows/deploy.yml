name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage site
        # everything the pages need, nothing else:
        # - player edit mode imports /vendor/itwriter, /tools/*.js and loads /songs/*.json;
        #   only synthesized songs (lantern_walk, demo) compile there — library/ samples are not shipped
        # - demos/ holds the shipped modules + adaptive manifests
        run: |
          mkdir _site
          cp index.html CNAME _site/
          cp -r assets listen player demos vendor tools songs _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
