<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mod_music player</title>
<style>
  :root {
    --bg: #14161c; --panel: #1d2026; --text: #d7dae0; --dim: #7d8590;
    --accent: #4fc1ff; --vu: #3fb950; --vu-hot: #d29922;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
  }
  h1 { font-size: 1.1rem; letter-spacing: .08em; color: var(--accent); }
  .panel { background: var(--panel); border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
  .row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; margin: .5rem 0; }
  button {
    background: #2a2e37; color: var(--text); border: 1px solid #3a3f4b;
    border-radius: 6px; padding: .4rem .9rem; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  input[type=text] {
    background: #0f1116; color: var(--text); border: 1px solid #3a3f4b;
    border-radius: 6px; padding: .4rem .6rem; font: inherit; flex: 1; min-width: 200px;
  }
  input[type=range] { accent-color: var(--accent); }
  label { color: var(--dim); }
  #meta { white-space: pre-wrap; color: var(--dim); }
  #pos { color: var(--accent); }
  #vu { display: flex; gap: 6px; align-items: flex-end; height: 96px; }
  .vubar { width: 22px; background: #0f1116; border-radius: 3px; position: relative; height: 100%; }
  .vufill { position: absolute; bottom: 0; width: 100%; border-radius: 3px; background: var(--vu); }
  .chname { text-align: center; color: var(--dim); font-size: 10px; margin-top: 4px; max-width: 22px; overflow: hidden; }
  #drop { border: 2px dashed #3a3f4b; border-radius: 8px; padding: 1rem; text-align: center; color: var(--dim); }
  #drop.over { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<h1>MOD_MUSIC · player</h1>

<div class="panel">
  <div class="row">
    <input type="text" id="url" value="../build/demo.it">
    <button id="loadUrl">Load URL</button>
    <input type="file" id="file" accept=".it,.xm,.mod,.s3m,.mptm,.med,.umx">
  </div>
  <div id="drop">…or drop a module file here</div>
</div>

<div class="panel">
  <div class="row">
    <button id="play">▶ Play/Pause</button>
    <button id="stop">■ Stop</button>
    <span id="pos">--:-- · ord -/- · row --</span>
  </div>
  <div class="row">
    <label>seek</label><input type="range" id="seek" min="0" max="100" step="0.1" value="0" style="flex:1">
  </div>
  <div class="row">
    <label>vol</label><input type="range" id="vol" min="0" max="1.5" step="0.01" value="1">
    <label>tempo</label><input type="range" id="tempo" min="0.5" max="2" step="0.05" value="1">
    <label>pitch</label><input type="range" id="pitch" min="0.5" max="2" step="0.05" value="1">
    <button id="reset">reset</button>
  </div>
</div>

<div class="panel">
  <div id="vu"></div>
  <div id="channames" style="display:flex; gap:6px;"></div>
</div>

<div class="panel"><div id="meta">no module loaded</div></div>

<script type="module">
import { ChiptuneJsPlayer } from './vendor/chiptune3/chiptune3.js';

const $ = (id) => document.getElementById(id);
let player = null;
let ready = false;
let seeking = false;
let started = false; // AudioContext needs a user gesture

function initPlayer() {
  player = new ChiptuneJsPlayer({ repeatCount: -1 });
  player.onInitialized(() => { ready = true; });
  player.onError((e) => { $('meta').textContent = 'error: ' + JSON.stringify(e); });

  player.onMetadata((meta) => {
    const song = meta.song || {};
    const lines = [
      `title:    ${meta.title || '(untitled)'}`,
      `tracker:  ${meta.tracker || '?'}   format: ${meta.type_long || meta.type || '?'}`,
      `duration: ${fmt(meta.dur)}   channels: ${(song.channels || []).length}`,
      `orders:   ${meta.totalOrders}   patterns: ${meta.totalPatterns}   samples: ${(song.samples || []).filter(Boolean).length}`,
      meta.message ? `\n${meta.message}` : '',
      `\nlibopenmpt ${meta.libopenmptVersion || ''}`,
    ];
    $('meta').textContent = lines.join('\n');
    $('seek').max = meta.dur || 100;
    buildVu(song.channels || []);
  });

  player.onProgress((d) => {
    if (!started) return; // ignore in-flight messages after stop
    $('pos').textContent = `${fmt(d.pos)} · ord ${d.order}/${(player.meta?.totalOrders ?? 0) - 1} · row ${String(d.row).padStart(2, '0')}`;
    if (!seeking) $('seek').value = d.pos;
    if (d.vu) updateVu(d.vu);
  });
}

function fmt(s) {
  if (s === undefined || isNaN(s)) return '--:--';
  s = Math.max(0, s);
  return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
}

// --- VU meters ---
let fills = [];
function buildVu(channels) {
  const vu = $('vu'); vu.innerHTML = '';
  const names = $('channames'); names.innerHTML = '';
  fills = channels.map((name, i) => {
    const bar = document.createElement('div'); bar.className = 'vubar';
    const fill = document.createElement('div'); fill.className = 'vufill';
    bar.appendChild(fill); vu.appendChild(bar);
    const n = document.createElement('div'); n.className = 'chname';
    n.textContent = name || i; names.appendChild(n);
    return fill;
  });
}
function updateVu(vu) {
  for (let i = 0; i < fills.length && i < vu.length; i++) {
    const v = Math.min(1, (vu[i].left + vu[i].right) / 2);
    fills[i].style.height = `${Math.round(v * 100)}%`;
    fills[i].style.background = v > 0.8 ? 'var(--vu-hot)' : 'var(--vu)';
  }
}

// --- loading ---
async function ensurePlayer() {
  if (!player) initPlayer();
  if (player.context.state === 'suspended') await player.context.resume();
  // wait for worklet init
  while (!ready) await new Promise((r) => setTimeout(r, 30));
}

async function loadUrl(url) {
  await ensurePlayer();
  player.load(url);
  started = true;
}
async function loadBuffer(buf) {
  await ensurePlayer();
  player.play(buf);
  started = true;
}

$('loadUrl').onclick = () => loadUrl($('url').value);
$('file').onchange = async (e) => {
  const f = e.target.files[0];
  if (f) loadBuffer(await f.arrayBuffer());
};

const drop = $('drop');
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = async (e) => {
  e.preventDefault(); drop.classList.remove('over');
  const f = e.dataTransfer.files[0];
  if (f) loadBuffer(await f.arrayBuffer());
};

// --- transport ---
$('play').onclick = async () => {
  if (!started) return loadUrl($('url').value); // first click: load default
  player.togglePause();
};
$('stop').onclick = () => { if (player) { player.stop(); started = false; $('pos').textContent = '--:-- · ord -/- · row --'; } };
$('seek').oninput = () => { seeking = true; };
$('seek').onchange = () => { if (player) player.setPos(parseFloat($('seek').value)); seeking = false; };
$('vol').oninput = () => { if (player) player.setVol(parseFloat($('vol').value)); };
$('tempo').oninput = () => { if (player) player.setTempo(parseFloat($('tempo').value)); };
$('pitch').oninput = () => { if (player) player.setPitch(parseFloat($('pitch').value)); };
$('reset').onclick = () => {
  $('tempo').value = 1; $('pitch').value = 1;
  if (player) { player.setTempo(1); player.setPitch(1); }
};
</script>
</body>
</html>
